services:
  # Servicio 'surfel_gabor' (variante GABOR). Renombrado desde 'surfel_env'
  # (2026-07-23) porque el usuario tiene OTRO docker-compose con el servicio
  # 'surfel_env' y quiere evitar la ambigüedad. Usar SIEMPRE este nombre en los
  # comandos: `docker compose exec surfel_gabor ...`.
  surfel_gabor:
    build: .
    # Imagen y container renombrados (variante GABOR) para COEXISTIR con el container
    # que ya corre (surfel_splatting_container). La imagen DEBE ser distinta: esta lleva
    # el rasterizer con el kernel Gabor -> compartir tag sobrescribiría al otro repo.
    image: surfel_gabor_image
    container_name: surfel_gabor_container
    runtime: nvidia
    volumes:
      - .:/workspace
    environment:
      # Servidor Blackwell = 1 sola GPU (RTX PRO 6000) -> GPU 0 por defecto.
      # Sobrescribible: `GPU_ID=0 docker compose up -d` (CLAUDE.md fija GPU_ID=0).
      - NVIDIA_VISIBLE_DEVICES=${GPU_ID:-0}
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    stdin_open: true
    tty: true
